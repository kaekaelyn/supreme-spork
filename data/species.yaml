invertebrates:

  - genus: Pseudopulex
    species: magnus
    unit: [Yixian]
    length_mm: 22.8
    type: ectoparasite
    note: >
      Flea-like ectoparasite, roughly ten times the size of a modern flea,
      with elongate serrated piercing stylets. Fed on feathered and haired
      vertebrates. A related Jehol species preserves a distended abdomen
      from a blood meal ~15x that of a modern flea.
    confidence: A
    source: huang_2012_fleas
    game_role: [parasite_pressure, sedentism_counterweight]
    design_note: >
      Drives the parasite-load system. Accumulates with settlement duration.
      Countered by smoke, winter freezing of bedding, burning old bedding,
      aromatic conifer boughs, and seasonal camp movement.

  - genus: Ephemeropsis
    species: trisetalis
    unit: [Yixian]
    type: mayfly
    abundance: superabundant
    note: Index fossil. Part of the EEL assemblage. Mass emergences.
    game_role: [seasonal_spectacle, fish_feeding_trigger, human_food]

  - genus: Eosestheria
