# ─────────────────────────────────────────────────────────────────────────────
# Flora. See docs/01-the-science.md §4 — the Carbohydrate Problem.
# NOTE: there is NO GRASS. Audit every art asset against this list.
flora:

  conifers:
    - genus: Liaoningocladus
      species: boii
      uses: [timber, bark_bast_cordage, resin, cambium_food]
    - genus: Podozamites
      uses: [timber, cambium_food]
    - genus: Elatides
      uses: [timber, resin]
    - genus: Schizolepis
      uses: [timber, seeds]
    - genus: Pityostrobus
      uses: [seeds, resin]
    - family: Cheirolepidiaceae
      note: Classopollis pollen producers. Drought-tolerant. Open/scrub biome.
    - family: Araucariaceae
      uses: [timber, seeds]
    - family: Pinaceae
      uses: [timber, resin, seeds, needle_infusion_vitamin_c]

  ginkgoales:
    - genus: Ginkgoites
      uses: [seeds_food_toxin_limited, timber]
      toxin:
        name: antivitamin_b6
        effect: Cumulative. Caps safe daily intake. Cannot be a staple.
    - genus: Baiera
    - genus: Sphenobaiera

  czekanowskiales:
    - genus: Czekanowskia
    - genus: Solenites
    - genus: Phoenicopsis

  bennettitales:
    - genus: Ptilophyllum
      uses: [seeds_food_requires_leaching]
    - genus: Otozamites
    - genus: Zamites

  cycadales:
    - genus: Nilssonia
      uses: [seeds_food_requires_leaching]
      toxin:
        name: cycasin
        effect: >
          Requires repeated soaking in changed water over days. Needs
          watertight vessels — this is why ceramics gates the plant economy.

  ferns:
    - genus: Coniopteris
      uses: [fiddleheads_food, rhizome_food, bedding]
      toxin: { name: thiaminase, effect: Destroyed by cooking. Chronic raw intake causes beriberi. }
    - genus: Onychiopsis
    - genus: Ruffordia
    - genus: Adiantopteris

  equisetales:
    - genus: Equisetites
      uses: [abrasive_scouring_rush, marginal_food, wattle_binder]
      note: Silica-rich. Genuinely better as a tool than a food.

  lycopodiales:
    - genus: Selaginellites
      uses: [ground_cover]

  gnetales:
    - genus: Chengia
      species: laxispicata
    - genus: Liaoxia
    - genus: Ephedrites
      uses: [stimulant_bronchodilator]
      confidence: C

  angiosperms:
    - genus: Archaefructus
      species_count: 3
      habitat: aquatic
      uses: [trivial_calories]
      note: >
        One of only ~5 angiosperm species in the entire formation. An aquatic
        herb. This is the sum total of flowering plants available.
    - genus: Hyrcantha
      synonym: Sinocarpus

  excluded:
    - genus: Archaeamphora
      reason: >
        Shown in 2015 not to be a carnivorous angiosperm, and probably not an
        angiosperm at all. Do not include.
      source: li_2015_archaeamphora
