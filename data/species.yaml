      Index fossil and the most abundant vertebrate in the formation.
      Part of the classic EEL index assemblage.
    game_role: [protein_floor, oil_source, shoaling, net_and_weir_target]
    design_note: >
      This animal is what actually keeps the player alive. Rendered for oil
