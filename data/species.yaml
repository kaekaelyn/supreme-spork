# Yixian Formation paleobiota — game dataset
#
# Schema documented in data/README.md. Every entry is validated in CI.
# This file is the single source of truth for the game's biology: spawn tables,
# ecology parameters, model bindings, and butchery tables are generated from it.
#
# NONE of these names, notes, or descriptions are ever shown to the player. The
# game names nothing and explains nothing. See docs/00-the-transplant.md §3.
#
# confidence values: A = preserved in the fossil record
#                    B = strongly inferred (phylogenetic bracketing / functional morphology)
#                    C = plausible, unpreservable by nature
#                    D = speculative but defensible
#
# unit: stratigraphic unit within the Yixian Formation where known.
# Anything not from the Yixian Formation does not belong in this file.
# See docs/01-the-science.md §7 for the exclusion list.

dataset_version: "0.1.0"
formation: "Yixian Formation"
age_ma: [125.8, 124.1]
paleolatitude_deg_n: 42

# ─────────────────────────────────────────────────────────────────────────────
theropods:

  - genus: Sinosauropteryx
    species: prima
    unit: [Jianshangou, Dawangzhangzi]
    length_m: 1.0
    mass_kg: 1.0
    diet: carnivore
    integument: filamentous_feathers
    coloration:
      confidence: A
      description: >
        Ginger/rufous and white banded tail. Countershaded — dark dorsally,
        pale ventrally. Dark "bandit mask" stripe across the eyes.
      source: smithwick_2017_sinosauropteryx
    habitat_inference:
      confidence: A
      value: open
      note: >
        Countershading style indicates open habitat in direct sunlight,
        not closed forest. Drives biome placement.
    game_role: [poster_animal, small_predator, prey_of_larger_theropods]

  - genus: Yutyrannus
    species: huali
    unit: [Yixian]
    length_m: 9.0
    mass_kg: 1400
    diet: carnivore
    integument: filamentous_feathers
    integument_note:
      confidence: A
      description: >
        Filamentous feathers 15-20 cm long preserved in patches on three
        specimens. Not flight feathers or modern down — simpler structures.
        Largest feathered animal known.
      source: xu_2012_yutyrannus
    game_role: [apex_predator, regional_event]
    population_note: >
      Never a mob. Maximum a handful per map, named individuals, persistent
      as full entities regardless of player proximity.

  - genus: Sinocalliopteryx
    species: gigas
    unit: [Jianshangou]
    length_m: 2.4
    diet: carnivore
    integument: filamentous_feathers
    gut_contents:
      confidence: A
      prey: [Confuciusornis, Sinornithosaurus]
      note: A directly fossilised food web. Use it.
      source: xing_2012_sinocalliopteryx
    game_role: [primary_threat_to_lone_human, active_hunter]

  - genus: Dilong
    species: paradoxus
    unit: [Lujiatun]
    length_m: 1.8
    diet: carnivore
    integument: filamentous_feathers
    integument_confidence: A
    game_role: [mid_tier_predator]

  - genus: Sinornithosaurus
    species: millenii
    unit: [Jianshangou]
    length_m: 1.2
    diet: carnivore
    integument: feathers
    pack_behaviour:
      confidence: D
      note: Scales with Speculation Level. Not assumed at Strict.
    game_role: [harassment_predator]

  - genus: Zhenyuanlong
    species: suni
    unit: [Yixian]
    length_m: 1.65
    diet: carnivore
    integument: pennaceous_feathers
    integument_note:
      confidence: A
      description: Large, well-developed pennaceous wing feathers despite being flightless.
    game_role: [harassment_predator, display_showcase]

  - genus: Beipiaosaurus
    species: inexpectus
    unit: [Jianshangou]
    length_m: 2.2
    diet: herbivore
    integument: filamentous_feathers
    integument_note:
      confidence: A
      description: >
        Preserves elongated broad filamentous feathers (EBFFs) — stiff,
        unbranched, display structures. Highly distinctive silhouette.
    game_role: [large_docile_herbivore, display_showcase]

  - genus: Caudipteryx
    species: zoui
    unit: [Jianshangou]
    length_m: 1.0
    diet: herbivore_omnivore
    diet_evidence:
      confidence: A
      note: Preserved gastroliths indicate plant processing.
    integument: pennaceous_feathers
    integument_note:
      confidence: A
      description: True pennaceous feathers on arms and a tail fan. Flightless.
    game_role: [approachable_prey, display_showcase, feather_source]

  - genus: Protarchaeopteryx
    species: robusta
    unit: [Jianshangou]
    length_m: 1.0
    diet: omnivore
    integument: pennaceous_feathers
    game_role: [small_prey, feather_source]

  - genus: Incisivosaurus
    species: gauthieri
    unit: [Lujiatun]
    length_m: 1.0
    diet: herbivore
    integument: feathers
    integument_confidence: B
    note: Prominent rodent-like incisors. Visually memorable.
    game_role: [small_prey]

  - genus: Sinovenator
    species: changii
    unit: [Lujiatun]
    length_m: 1.0
    diet: carnivore
    integument: feathers
    integument_confidence: B
    game_role: [small_predator]

  - genus: Mei
    species: long
    unit: [Lujiatun]
    length_m: 0.5
    diet: carnivore
    integument: feathers
    integument_confidence: B
    behaviour:
      confidence: A
      description: >
        Preserved in a curled, tucked sleeping posture with the snout under
        the forelimb — identical to modern birds. Direct fossil evidence of
        sleeping behaviour. Implement this literally.
    game_role: [ambient, quiet_discovery]

  - genus: Jianianhualong
    species: tengi
    unit: [Dawangzhangzi]
    length_m: 1.1
    diet: carnivore
    integument: pennaceous_feathers
    integument_note:
      confidence: A
      description: Asymmetrical tail feathers — earliest evidence in troodontids.
    game_role: [small_predator]

  - genus: Huaxiagnathus
    species: orientalis
    unit: [Jianshangou]
    length_m: 1.8
    diet: carnivore
    integument: filamentous_feathers
    integument_confidence: B
    game_role: [mid_tier_predator]

  - genus: Shenzhousaurus
    species: orientalis
    unit: [Yixian]
    length_m: 1.6
    diet: omnivore_herbivore
    integument: feathers
    integument_confidence: B
    note: Basal ornithomimosaur. Gastroliths preserved.
    game_role: [fast_prey]

